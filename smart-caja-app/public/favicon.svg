<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Deep Petrol Slate with subtle radial depth -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#142642" />
      <stop offset="60%" stop-color="#0B1526" />
      <stop offset="100%" stop-color="#060C17" />
    </radialGradient>

    <!-- Squircle Border Glow -->
    <linearGradient id="borderGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#00E59B" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#0F766E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.45" />
    </linearGradient>

    <!-- Primary Emerald-Cyan Brand Gradient -->
    <linearGradient id="tealGrad" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#00E59B" />
    </linearGradient>

    <!-- Accent Cyan Gradient for Upper Blade -->
    <linearGradient id="bladeGrad" x1="180" y1="120" x2="350" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Drop shadow for the central glyph -->
    <filter id="shadow" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00E59B" flood-opacity="0.28" />
    </filter>

    <!-- Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00E59B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E59B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Squircle Container with rounded superellipse corners -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="118" stroke="url(#borderGrad)" stroke-width="5" />

  <!-- 2. Ambient backlight glow -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)" />

  <!-- 3. The Iconic "Smart Caja" Glyph:
       Interlocking S-ribbon with high-end fintech geometry and smart center node
  -->
  <g filter="url(#shadow)">
    <!-- Top Wing (Upper Loop of S + Top of Caja) -->
    <path d="M 208 132
             H 328
             C 356.7 132 380 155.3 380 184
             C 380 208.2 363.8 228.6 341.6 234.6
             L 256 258
             C 238.3 263 226 279.1 226 297.5
             V 300
             H 174
             V 294
             C 174 256.4 200.5 224 237.6 213.5
             L 322 189.5
             C 326 188.4 328 185.8 328 184
             C 328 181.8 326.2 180 324 180
             H 208
             C 194.7 180 184 169.3 184 156
             C 184 142.7 194.7 132 208 132 Z"
          fill="url(#bladeGrad)" />

    <!-- Bottom Wing (Lower Loop of S + Bottom of Caja) -->
    <path d="M 304 380
             H 184
             C 155.3 380 132 356.7 132 328
             C 132 303.8 148.2 283.4 170.4 277.4
             L 256 254
             C 273.7 249 286 232.9 286 214.5
             V 212
             H 338
             V 218
             C 338 255.6 311.5 288 274.4 298.5
             L 190 322.5
             C 186 323.6 184 326.2 184 328
             C 184 330.2 185.8 332 188 332
             H 304
             C 317.3 332 328 342.7 328 356
             C 328 369.3 317.3 380 304 380 Z"
          fill="url(#tealGrad)" />

    <!-- Center Node / Spark of Intelligence (Connecting the two ribbons) -->
    <circle cx="256" cy="256" r="24" fill="#5EEAD4" />
    <circle cx="256" cy="256" r="14" fill="#091322" />
    <circle cx="256" cy="256" r="7" fill="#5EEAD4" />
  </g>
</svg>